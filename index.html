<!DOCTYPE html>

<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#050510;color:#e0e6f0}
canvas{display:block}

/* ── Glassmorphism helper ─────────────────────────────────── */
.glass{
  background:rgba(10,14,30,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(120,160,255,.18);
  border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.45);
}

/* ── Control Panel (left) ─────────────────────────────────── */
#controls{
  position:absolute;top:16px;left:16px;width:280px;padding:18px 20px;
  z-index:10;
}
#controls h2{font-size:15px;text-transform:uppercase;letter-spacing:1.6px;color:#7eb8ff;margin-bottom:14px;text-align:center}
.ctrl-group{margin-bottom:12px}
.ctrl-group label{display:block;font-size:12px;color:#8ea8d0;margin-bottom:4px}
.ctrl-group input[type=range]{width:100%;accent-color:#4d8fff}
.ctrl-group .val{float:right;font-size:12px;color:#a0c4ff}
.btn{
  display:inline-block;padding:7px 14px;font-size:12px;cursor:pointer;
  border:1px solid rgba(100,160,255,.35);border-radius:8px;
  background:rgba(60,100,200,.18);color:#b0d0ff;
  transition:background .2s,color .2s;margin:3px 2px;text-align:center;
}
.btn:hover{background:rgba(80,140,255,.35);color:#fff}
.btn.active{background:rgba(50,180,120,.3);border-color:rgba(50,200,140,.5);color:#70ffb8}
.btn-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}

/* ── Telemetry (right) ────────────────────────────────────── */
#telemetry{
  position:absolute;top:16px;right:16px;width:260px;padding:18px 20px;
  z-index:10;
}
#telemetry h2{font-size:15px;text-transform:uppercase;letter-spacing:1.6px;color:#7eb8ff;margin-bottom:14px;text-align:center}
.telem-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(100,140,220,.1)}
.telem-row .lbl{color:#7a99c4}
.telem-row .val{color:#c0dcff;font-variant-numeric:tabular-nums}

/* ── Presentation Button ──────────────────────────────────── */
#openPresBtn{
  position:absolute;bottom:20px;right:20px;z-index:10;
  padding:10px 22px;font-size:14px;cursor:pointer;
  border:1px solid rgba(100,160,255,.4);border-radius:10px;
  background:rgba(40,70,160,.35);color:#a0ccff;
  backdrop-filter:blur(8px);
  transition:background .25s;
}
#openPresBtn:hover{background:rgba(60,100,200,.55);color:#fff}

/* ── Presentation Modal ───────────────────────────────────── */
#presModal{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(2,4,14,.82);
  justify-content:center;align-items:center;
}
#presModal.open{display:flex}
#presContent{
  width:min(800px,92vw);max-height:86vh;padding:32px 36px;
  overflow-y:auto;position:relative;
}
#presContent h3{font-size:22px;color:#80b8ff;margin-bottom:14px}
#presContent p,#presContent li{font-size:15px;line-height:1.72;color:#bcc8e0;margin-bottom:10px}
#presContent ul{padding-left:22px}
#presContent .math-block{margin:14px 0;text-align:center;font-size:17px;color:#d0e0ff}
.pres-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid rgba(100,150,255,.15)}
.pres-nav .btn{min-width:90px}
.pres-nav .page-ind{font-size:13px;color:#6a8ab8}
#closePresBtn{
  position:absolute;top:14px;right:18px;font-size:22px;cursor:pointer;
  color:#6a8ab8;background:none;border:none;transition:color .2s;
}
#closePresBtn:hover{color:#fff}

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,150,255,.25);border-radius:3px}
</style>

<body>

<!-- ════════════════════════════════════════════════════════════
     CONTROL PANEL
     ════════════════════════════════════════════════════════ -->
<div id="controls" class="glass">
  <h2>⚡ Tether Controls</h2>

  <div class="btn-row">
    <button class="btn" id="btnCurrentOn">Current: OFF</button>
    <button class="btn" id="btnPolarity">Polarity: +</button>
  </div>

  <div class="ctrl-group" style="margin-top:14px">
    <label>Tether Length (L) <span class="val" id="valLen">20 km</span></label>

  <div class="ctrl-group">
    <label>Current Magnitude (I) <span class="val" id="valCur">5 A</span></label>

  </div>

  <div class="ctrl-group">
    <label>Time Warp <span class="val" id="valTime">100×</span></label>

</div>

  <div class="telem-row"><span class="lbl">Altitude</span><span class="val" id="tAlt">—</span></div>
  <div class="telem-row"><span class="lbl">Velocity</span><span class="val" id="tVel">—</span></div>
  <div class="telem-row"><span class="lbl">Lorentz Force</span><span class="val" id="tForce">—</span></div>
  <div class="telem-row"><span class="lbl">Orbital Energy</span><span class="val" id="tEnergy">—</span></div>

</div>

<!-- ════════════════════════════════════════════════════════════
     PRESENTATION BUTTON & MODAL
     ════════════════════════════════════════════════════════ -->
<button id="openPresBtn">📖 Learn: EDT Science</button>

<div id="presModal">
  <div id="presContent" class="glass">
    <button id="closePresBtn">&times;</button>
    <div id="presPages"></div>
    <div class="pres-nav">
      <button class="btn" id="presPrev">◀ Previous</button>
      <span class="page-ind" id="presPageInd">1 / 5</span>
      <button class="btn" id="presNext">Next ▶</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     MAIN SCRIPT
     ════════════════════════════════════════════════════════ -->
<script>
/* ──────────────────────────────────────────────────────────
   PHYSICAL CONSTANTS  (SI)
   ────────────────────────────────────────────────────────── */
const G        = 6.674e-11;       // gravitational constant
const M_EARTH  = 5.972e24;        // kg
const R_EARTH  = 6.371e6;         // metres
const MU       = G * M_EARTH;     // standard gravitational parameter
const B0       = 3.12e-5;         // magnetic field at equator surface (T)
// Magnetic moment of Earth  m = B0 * R_E^3
const MAG_MOM  = B0 * Math.pow(R_EARTH, 3);  // T·m³

/* ──────────────────────────────────────────────────────────
   SIM SCALE
   We map 1 unit in Three.js  =  R_EARTH metres.
   ────────────────────────────────────────────────────────── */
const SCALE = R_EARTH;  // 1 unit = R_EARTH

/* ──────────────────────────────────────────────────────────
   SIMULATION STATE
   ────────────────────────────────────────────────────────── */
const state = {
  // Orbital state in SI (metres, m/s)
  r: null,   // THREE.Vector3 position
  v: null,   // THREE.Vector3 velocity
  // Controls
  currentOn: false,
  polarity: 1,           // +1 = boost, -1 = deorbit
  tetherLength: 20e3,    // metres
  currentMag: 5,         // amperes
  timeWarp: 100,
  // Computed
  lorentzMag: 0
};

// Start at 400 km altitude, circular orbit, equatorial
const startAlt = 400e3; // metres above surface
const startR   = R_EARTH + startAlt;
const startV   = Math.sqrt(MU / startR);
state.r = new THREE.Vector3(startR, 0, 0);
state.v = new THREE.Vector3(0, 0, startV);  // tangential

/* ──────────────────────────────────────────────────────────
   THREE.JS  SETUP
   ────────────────────────────────────────────────────────── */
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(0, 3, 5);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls3D = new THREE.OrbitControls(camera, renderer.domElement);
controls3D.enableDamping = true;
controls3D.dampingFactor = 0.08;
controls3D.minDistance   = 1.5;
controls3D.maxDistance   = 50;

// Ambient + directional light
scene.add(new THREE.AmbientLight(0x334466, 0.6));
const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
sunLight.position.set(5, 3, 4);
scene.add(sunLight);

/* ── Starfield ────────────────────────────────────────────── */
(function createStars(){
  const geo = new THREE.BufferGeometry();
  const n = 6000;
  const pos = new Float32Array(n * 3);
  for(let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 300;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
})();

/* ── Earth ────────────────────────────────────────────────── */
const earthGeo  = new THREE.SphereGeometry(1, 64, 48);
const earthMat  = new THREE.MeshPhongMaterial({
  color: 0x2255aa,
  emissive: 0x112244,
  emissiveIntensity: 0.15,
  shininess: 25,
  wireframe: false
});
const earthMesh = new THREE.Mesh(earthGeo, earthMat);
scene.add(earthMesh);

// Add subtle wireframe overlay for "globe" feel
const wireGeo = new THREE.SphereGeometry(1.002, 32, 24);
const wireMat = new THREE.MeshBasicMaterial({ color: 0x4488cc, wireframe: true, transparent: true, opacity: 0.08 });
scene.add(new THREE.Mesh(wireGeo, wireMat));

// Atmosphere glow
const atmoGeo = new THREE.SphereGeometry(1.06, 48, 32);
const atmoMat = new THREE.MeshBasicMaterial({ color: 0x4499ff, transparent: true, opacity: 0.08, side: THREE.BackSide });
scene.add(new THREE.Mesh(atmoGeo, atmoMat));

/* ── Satellite ────────────────────────────────────────────── */
const satGroup = new THREE.Group();
// Body
const satBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.04, 0.04, 0.06),
  new THREE.MeshPhongMaterial({ color: 0xcccccc, emissive: 0x333333 })
);
satGroup.add(satBody);
// Solar panels
const panelMat = new THREE.MeshPhongMaterial({ color: 0x2244aa, emissive: 0x112266, side: THREE.DoubleSide });
for(let s = -1; s <= 1; s += 2){
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.03), panelMat);
  panel.position.set(s * 0.06, 0, 0);
  panel.rotation.y = Math.PI / 2;
  satGroup.add(panel);
}
scene.add(satGroup);

/* ── Tether line ──────────────────────────────────────────── */
const tetherMat = new THREE.LineBasicMaterial({ color: 0xff6644, transparent: true, opacity: 0.9 });
const tetherGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const tetherLine = new THREE.Line(tetherGeo, tetherMat);
scene.add(tetherLine);

/* ── Orbit trail ──────────────────────────────────────────── */
const TRAIL_MAX = 2000;
const trailPositions = new Float32Array(TRAIL_MAX * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
trailGeo.setDrawRange(0, 0);
const trailMat = new THREE.LineBasicMaterial({ color: 0x22ff88, transparent: true, opacity: 0.45 });
const trailLine = new THREE.Line(trailGeo, trailMat);
scene.add(trailLine);
let trailIdx = 0;
let trailCount = 0;

/* ── Predicted orbit (Keplerian ellipse approximation) ──── */
const predPoints = [];
for(let i = 0; i <= 200; i++) predPoints.push(new THREE.Vector3());
const predGeo = new THREE.BufferGeometry().setFromPoints(predPoints);
const predMat = new THREE.LineBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.3 });
const predLine = new THREE.Line(predGeo, predMat);
scene.add(predLine);

/* ── Magnetic field lines ─────────────────────────────────── */
(function createFieldLines(){
  const fieldGroup = new THREE.Group();
  const nLines = 12;
  for(let k = 0; k < nLines; k++){
    const phi = (k / nLines) * Math.PI * 2;
    const pts = [];
    for(let th = -Math.PI * 0.45; th <= Math.PI * 0.45; th += 0.04){
      // Dipole field line: r = L_shell * cos^2(theta)
      const L = 2.8;
      const rr = L * Math.cos(th) * Math.cos(th);
      if(rr < 1.08) continue;
      const x = rr * Math.cos(th) * Math.cos(phi);
      const y = rr * Math.sin(th);
      const z = rr * Math.cos(th) * Math.sin(phi);
      pts.push(new THREE.Vector3(x, y, z));
    }
    if(pts.length > 2){
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: 0x6644ff, transparent: true, opacity: 0.15 });
      fieldGroup.add(new THREE.Line(geo, mat));
    }
  }
  scene.add(fieldGroup);
})();

/* ──────────────────────────────────────────────────────────
   PHYSICS: MAGNETIC FIELD  (Dipole model in Cartesian)
   B_r     =  -2 * MAG_MOM * sin(lat) / r^3
   B_theta =     MAG_MOM * cos(lat) / r^3
   We work in equatorial plane (lat ~ 0 for simplicity),
   but handle 3D properly for generality.
   ────────────────────────────────────────────────────────── */
function magneticField(pos){
  // pos is THREE.Vector3 in SI metres
  const r  = pos.length();
  const r3 = r * r * r;
  // Magnetic dipole moment along +Y axis
  const m = new THREE.Vector3(0, MAG_MOM, 0);
  // B = (mu0/4pi)[ 3(m·r̂)r̂ - m ] / r^3   but for geomagnetic we use B0*R^3 already
  // B = (3(m·r̂)r̂ - m) / r^3
  const rhat = pos.clone().normalize();
  const mdotr = m.dot(rhat);
  const B = rhat.clone().multiplyScalar(3 * mdotr).sub(m).divideScalar(r3);
  return B;
}

/* ──────────────────────────────────────────────────────────
   PHYSICS: LORENTZ FORCE ON TETHER
   F = I * (L_vec × B)
   Tether is radial (along r̂ from Earth centre).
   ────────────────────────────────────────────────────────── */
function lorentzForce(pos, vel){
  if(!state.currentOn) return new THREE.Vector3();
  const rhat = pos.clone().normalize();
  // Tether vector: along radial, length = tetherLength
  const Lvec = rhat.clone().multiplyScalar(state.tetherLength);
  const B = magneticField(pos);
  // F = I * (dL × B)  integrated over tether (uniform I, uniform B approx)
  const F = new THREE.Vector3().crossVectors(Lvec, B).multiplyScalar(state.currentMag * state.polarity);
  state.lorentzMag = F.length();
  return F;
}

/* ──────────────────────────────────────────────────────────
   PHYSICS: ACCELERATION  (gravity + Lorentz)
   ────────────────────────────────────────────────────────── */
const SAT_MASS = 1000; // kg (typical small satellite)

function acceleration(pos, vel){
  const r = pos.length();
  // Gravity: a_g = -MU / r^3 * r_vec
  const aGrav = pos.clone().multiplyScalar(-MU / (r * r * r));
  // Lorentz
  const fL = lorentzForce(pos, vel);
  const aLorentz = fL.divideScalar(SAT_MASS);
  return aGrav.add(aLorentz);
}

/* ──────────────────────────────────────────────────────────
   INTEGRATOR:  RK4
   ────────────────────────────────────────────────────────── */
function rk4Step(pos, vel, dt){
  // k1
  const a1 = acceleration(pos, vel);
  const k1v = a1.clone().multiplyScalar(dt);
  const k1r = vel.clone().multiplyScalar(dt);

  // k2
  const p2 = pos.clone().add(k1r.clone().multiplyScalar(0.5));
  const v2 = vel.clone().add(k1v.clone().multiplyScalar(0.5));
  const a2 = acceleration(p2, v2);
  const k2v = a2.clone().multiplyScalar(dt);
  const k2r = v2.clone().multiplyScalar(dt);

  // k3
  const p3 = pos.clone().add(k2r.clone().multiplyScalar(0.5));
  const v3 = vel.clone().add(k2v.clone().multiplyScalar(0.5));
  const a3 = acceleration(p3, v3);
  const k3v = a3.clone().multiplyScalar(dt);
  const k3r = v3.clone().multiplyScalar(dt);

  // k4
  const p4 = pos.clone().add(k3r);
  const v4 = vel.clone().add(k3v);
  const a4 = acceleration(p4, v4);
  const k4v = a4.clone().multiplyScalar(dt);
  const k4r = v4.clone().multiplyScalar(dt);

  // Combine
  const dr = k1r.add(k2r.multiplyScalar(2)).add(k3r.multiplyScalar(2)).add(k4r).multiplyScalar(1/6);
  const dv = k1v.add(k2v.multiplyScalar(2)).add(k3v.multiplyScalar(2)).add(k4v).multiplyScalar(1/6);

  return {
    pos: pos.clone().add(dr),
    vel: vel.clone().add(dv)
  };
}

/* ──────────────────────────────────────────────────────────
   PREDICTED ORBIT (Keplerian, no tether)
   ────────────────────────────────────────────────────────── */
function updatePredictedOrbit(){
  let pr = state.r.clone();
  let pv = state.v.clone();
  const pdt = 20; // seconds per step
  const arr = predGeo.attributes.position.array;
  for(let i = 0; i <= 200; i++){
    const idx = i * 3;
    arr[idx]   = pr.x / SCALE;
    arr[idx+1] = pr.y / SCALE;
    arr[idx+2] = pr.z / SCALE;
    // Pure gravity step (no Lorentz) for prediction
    const r  = pr.length();
    const ag = pr.clone().multiplyScalar(-MU / (r * r * r));
    pv = pv.clone().add(ag.multiplyScalar(pdt));
    pr = pr.clone().add(pv.clone().multiplyScalar(pdt));
  }
  predGeo.attributes.position.needsUpdate = true;
}

/* ──────────────────────────────────────────────────────────
   UI CONTROLS
   ────────────────────────────────────────────────────────── */
const btnCurrentOn = document.getElementById('btnCurrentOn');
const btnPolarity  = document.getElementById('btnPolarity');
const sliderLen    = document.getElementById('sliderLen');
const sliderCur    = document.getElementById('sliderCur');
const sliderTime   = document.getElementById('sliderTime');

btnCurrentOn.addEventListener('click', () => {
  state.currentOn = !state.currentOn;
  btnCurrentOn.textContent = state.currentOn ? 'Current: ON' : 'Current: OFF';
  btnCurrentOn.classList.toggle('active', state.currentOn);
});

btnPolarity.addEventListener('click', () => {
  state.polarity *= -1;
  btnPolarity.textContent = state.polarity > 0 ? 'Polarity: + (Boost)' : 'Polarity: − (Drag)';
  btnPolarity.classList.toggle('active', state.polarity < 0);
});

sliderLen.addEventListener('input', e => {
  state.tetherLength = parseFloat(e.target.value) * 1e3;
  document.getElementById('valLen').textContent = e.target.value + ' km';
});

sliderCur.addEventListener('input', e => {
  state.currentMag = parseFloat(e.target.value);
  document.getElementById('valCur').textContent = e.target.value + ' A';
});

sliderTime.addEventListener('input', e => {
  state.timeWarp = parseFloat(e.target.value);
  document.getElementById('valTime').textContent = e.target.value + '×';
});

/* ──────────────────────────────────────────────────────────
   TELEMETRY
   ────────────────────────────────────────────────────────── */
const tAlt    = document.getElementById('tAlt');
const tVel    = document.getElementById('tVel');
const tForce  = document.getElementById('tForce');
const tEnergy = document.getElementById('tEnergy');
const tPeriod = document.getElementById('tPeriod');

function updateTelemetry(){
  const r = state.r.length();
  const v = state.v.length();
  const alt = (r - R_EARTH) / 1e3;
  const vkm = v / 1e3;
  const KE = 0.5 * SAT_MASS * v * v;
  const PE = -MU * SAT_MASS / r;
  const E  = KE + PE;
  // Semi-major axis from vis-viva
  const a = -MU * SAT_MASS / (2 * E);
  const T = 2 * Math.PI * Math.sqrt(a * a * a / MU);

  tAlt.textContent    = alt.toFixed(1) + ' km';
  tVel.textContent    = vkm.toFixed(3) + ' km/s';
  tForce.textContent  = state.lorentzMag.toFixed(4) + ' N';
  tEnergy.textContent = (E / 1e6).toFixed(2) + ' MJ';
  tPeriod.textContent = isFinite(T) ? (T / 60).toFixed(1) + ' min' : '—';
}

/* ──────────────────────────────────────────────────────────
   ANIMATION LOOP
   ────────────────────────────────────────────────────────── */
let lastTime = 0;
let trailTimer = 0;

function animate(timestamp){
  requestAnimationFrame(animate);
  const dtReal = Math.min((timestamp - lastTime) / 1000, 0.05); // cap for tab inactivity
  lastTime = timestamp;

  const dtSim = dtReal * state.timeWarp;

  // Sub-step to keep integration stable
  const substeps = Math.max(1, Math.ceil(dtSim / 5));
  const h = dtSim / substeps;
  for(let i = 0; i < substeps; i++){
    const result = rk4Step(state.r, state.v, h);
    state.r = result.pos;
    state.v = result.vel;
  }

  // Clamp minimum altitude to prevent crash through Earth
  const rLen = state.r.length();
  if(rLen < R_EARTH + 100e3){
    state.r.normalize().multiplyScalar(R_EARTH + 100e3);
    // Reflect radial velocity component
    const rhat = state.r.clone().normalize();
    const vr = rhat.clone().multiplyScalar(state.v.dot(rhat));
    state.v.sub(vr).sub(vr); // reverse radial component
  }

  // ── Update 3D objects ──
  const sx = state.r.x / SCALE;
  const sy = state.r.y / SCALE;
  const sz = state.r.z / SCALE;
  satGroup.position.set(sx, sy, sz);
  satGroup.lookAt(0, 0, 0);

  // Tether (extends radially inward from satellite)
  const rhat = state.r.clone().normalize();
  const tetherEnd = state.r.clone().sub(rhat.multiplyScalar(state.tetherLength));
  const tArr = tetherLine.geometry.attributes.position.array;
  tArr[0] = sx; tArr[1] = sy; tArr[2] = sz;
  tArr[3] = tetherEnd.x / SCALE; tArr[4] = tetherEnd.y / SCALE; tArr[5] = tetherEnd.z / SCALE;
  tetherLine.geometry.attributes.position.needsUpdate = true;
  // Color tether based on current
  if(state.currentOn){
    tetherLine.material.color.set(state.polarity > 0 ? 0x44ff88 : 0xff4466);
    tetherLine.material.opacity = 1;
  } else {
    tetherLine.material.color.set(0xff6644);
    tetherLine.material.opacity = 0.4;
  }

  // Trail
  trailTimer += dtSim;
  if(trailTimer > 10){
    trailTimer = 0;
    const ti = trailIdx * 3;
    trailPositions[ti]   = sx;
    trailPositions[ti+1] = sy;
    trailPositions[ti+2] = sz;
    trailIdx = (trailIdx + 1) % TRAIL_MAX;
    trailCount = Math.min(trailCount + 1, TRAIL_MAX);
    trailGeo.attributes.position.needsUpdate = true;
    trailGeo.setDrawRange(0, trailCount);
  }

  // Predicted orbit (update less frequently)
  if(Math.random() < 0.05) updatePredictedOrbit();

  // Earth slow rotation
  earthMesh.rotation.y += dtReal * 0.05;

  // Telemetry
  updateTelemetry();

  controls3D.update();
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

});

function showPage(n){
  presPage = Math.max(0, Math.min(n, presPages.length - 1));
